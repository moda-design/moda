name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun cross-compile runtimes
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-compile-${{ runner.os }}-1.3.14
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Typecheck + tests
        working-directory: cli
        run: bun run typecheck && bun test
      - name: Build matrix (darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64)
        run: bun scripts/build.ts
      - name: Stamp npm packages + place binaries
        run: bun scripts/package-npm.ts
      - name: MCP projection check + claude.ai skill ZIPs (attached to the release like the binaries)
        run: |
          python3 scripts/project-mcp.py check
          python3 scripts/project-mcp.py zips
      - name: npm pack (tarballs attached to the release alongside the binaries)
        run: |
          mkdir -p dist
          for pkg in packages/moda packages/cli-darwin-arm64 packages/cli-darwin-x64 packages/cli-linux-x64 packages/cli-linux-arm64 packages/cli-win32-x64; do
            (cd "$pkg" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          done
      - name: Checksums + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts "${GITHUB_REF_NAME}"
      - name: Publish npm packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "@moda-design:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          for pkg in packages/cli-darwin-arm64 packages/cli-darwin-x64 packages/cli-linux-x64 packages/cli-linux-arm64 packages/cli-win32-x64 packages/moda; do
            (cd "$pkg" && npm publish)
          done
