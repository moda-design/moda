name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fan-out is fresh
        run: |
          ./scripts/fanout.sh
          git diff --exit-code -- skills/ || {
            echo "fan-out drift: edit shared/references and commit scripts/fanout.sh output"; exit 1; }
      - name: Validate
        run: python3 scripts/validate.py
      - name: Shell syntax
        run: sh -n setup && sh -n scripts/fanout.sh
