name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: cli
        run: bun run typecheck
      - name: Unit tests
        working-directory: cli
        run: bun test
      - name: Compile host binary
        run: bun scripts/build.ts --host
        if: hashFiles('scripts/build.ts') != ''
      - name: Inventory parity
        run: bun scripts/inventory-check.ts
        if: hashFiles('scripts/inventory-check.ts') != ''

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills (when present)
        run: |
          if [ -d skills ]; then
            echo "skills/ present — running validation greps"
            # Banned internal tool names / installer patterns (skills-and-distribution §3.4).
            ! grep -RnE 'curl[^|]*\|\s*sh|sudo ' skills/ setup 2>/dev/null || (echo 'banned pattern found' && exit 1)
          else
            echo "skills/ not present yet — skipping"
          fi
