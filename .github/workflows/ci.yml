name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: cli
        run: bun run typecheck
      - name: Unit tests
        working-directory: cli
        run: bun test
      - name: Compile host binary
        run: bun scripts/build.ts --host
      - name: Stub-server proof (version, doctor, auth listener flow)
        run: bun scripts/prove-stub.ts
      - name: Inventory parity
        run: bun scripts/inventory-check.ts

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills (frontmatter, shared-block + fanout byte-identity, banned names, verb parity)
        run: MODA_CLI_STRICT=1 MODA_CLI_ROOT=. python3 scripts/validate.py
      - name: Fanout drift check (fanout.sh output matches the committed copies)
        run: |
          ./scripts/fanout.sh
          git diff --exit-code -- skills/ || (echo 'fanned references drifted — run scripts/fanout.sh and commit' && exit 1)
